<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>そうた｜たっちゃん家</title><link rel="stylesheet" href="site.css"><style>.profile-lead{font-size:.85rem;color:#967760;text-align:center;letter-spacing:.08em}.profile-bio{max-width:490px;margin:12px auto 28px;text-align:left}.profile-bio p{margin:0 0 1.05em;line-height:1.95}.photos figure{margin:0;min-width:0}.photos .photo-tap{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-in}.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}.photos figcaption{font-size:clamp(10px,2.8vw,14px);margin-top:8px;color:#805d48}.profile-hero{max-width:420px;width:100%;max-height:440px;object-fit:contain}.photo-dialog::backdrop{background:#241b16b9}.photo-dialog img{display:block;max-width:min(85vw,850px);max-height:75vh;object-fit:contain}.photo-dialog p{text-align:center;margin:6px 0}@media(max-width:450px){.panel{padding:16px 12px}.photos{gap:7px}}</style></head><body><main class="wrap"><h1>🐾 そうたの部屋 🐾</h1><p class="profile-lead">MOMO'S FRIENDS</p><section class="panel"><img class="main-photo profile-hero" src="sota.jpg" alt="そうたのメイン写真"><h2>🎨 そうた</h2><div class="profile-bio"><p>そうたです。美術部に所属しています。ももとは部活の先輩・後輩です。</p><p>絵を描いている時間が、いちばん落ち着きます。</p><p>薄いグレーの毛と、青い目が目印です。</p><p>夕焼けの色が好きで、ついスケッチブックを開いてしまいます。</p><p>誰かの「好き」を、そっと応援できる人でいたいです。</p></div><h2>📸 そうたの3つの顔</h2><div class="photos"><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'そうた・🎨 キャンバスの前で')" aria-label="🎨 キャンバスの前での写真を拡大"><img src="sota-paint.jpg" alt="そうた・🎨 キャンバスの前で" loading="lazy"></button><figcaption>🎨 キャンバスの前で</figcaption></figure><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'そうた・🖊️ 公園でデッサン')" aria-label="🖊️ 公園でデッサンの写真を拡大"><img src="sota-sketch.jpg" alt="そうた・🖊️ 公園でデッサン" loading="lazy"></button><figcaption>🖊️ 公園でデッサン</figcaption></figure><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'そうた・🌇 夕日の美術室')" aria-label="🌇 夕日の美術室の写真を拡大"><img src="sota-gallery.jpg" alt="そうた・🌇 夕日の美術室" loading="lazy"></button><figcaption>🌇 夕日の美術室</figcaption></figure></div><p style="font-size:.8rem;color:#967760">写真をタップすると大きく見られるよ♡</p></section><dialog id="photoDialog" class="photo-dialog" onclick="if(event.target===this)this.close()"><button type="button" class="close" onclick="document.getElementById('photoDialog').close()">閉じる ×</button><img id="bigPhoto" alt="拡大写真"><p id="photoCaption"></p></dialog><script>function showPhoto(src,caption){document.getElementById('bigPhoto').src=src;document.getElementById('photoCaption').textContent=caption;document.getElementById('photoDialog').showModal()}</script><p style="text-align:center"><a class="button" href="momo-friends.html">🐾 お友達紹介に戻る</a></p></main></body></html>
