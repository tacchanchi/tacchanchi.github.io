<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たっちゃん家｜管理室</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#56392c;font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',sans-serif}main{max-width:740px;margin:auto;padding:18px}h1{text-align:center}section{background:#fff;border:1px solid #e9d4bd;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 10px #5c392010}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #cdbba7;border-radius:10px}textarea{min-height:90px}button{background:#a66d42;color:white;border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:bold;margin:9px 5px 0 0}button.secondary{background:#796b60}button:disabled{opacity:.45}img.preview{width:100%;max-width:280px;border-radius:12px;margin:10px 0}.hidden{display:none}small{color:#766656}#status{white-space:pre-wrap}a{color:#875b36}.item{border-top:1px dashed #ddd;padding:10px 0}.danger{background:#a04444}</style></head><body><main><h1>🐾 たっちゃん家 管理室</h1><p><a href="./">← ホームページへ戻る</a></p><p id="status" role="status">読み込み中…</p><section id="loginSection"><h2>🔐 管理者ログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="login">ログイン</button></section><div id="editor" class="hidden"><button class="secondary" id="logout">ログアウト</button><section><h2>🐱 家族・ペットのプロフィール</h2><label>編集する子<select id="person"></select></label><label>ひとこと・紹介文<textarea id="bio"></textarea></label><label>趣味<textarea id="hobby"></textarea></label><label>特技<textarea id="talent"></textarea></label><h3>📸 写真館（各4枚）</h3><p><small>写真を選んで保存すると、選択した番号の写真を入れ替えるで。</small></p><label>写真の位置<select id="slot"><option value="0">1枚目</option><option value="1">2枚目</option><option value="2">3枚目</option><option value="3">4枚目</option></select></label><label>写真<input id="profilePhoto" type="file" accept="image/*"></label><div id="profilePhotos"></div><button id="saveProfile">プロフィールを保存</button></section><section><h2>🍳 お料理レシピ</h2><label>登録済みの料理<select id="recipeSelect"><option value="">新しい料理を登録</option></select></label><label>料理名<input id="recipeTitle" maxlength="100"></label><label>説明<textarea id="recipeDesc"></textarea></label><label>材料<textarea id="ingredients"></textarea></label><label>作り方<textarea id="steps"></textarea></label><label>料理写真<input id="recipePhoto" type="file" accept="image/*"></label><div id="recipePreview"></div><button id="saveRecipe">レシピを保存</button><button class="danger" id="deleteRecipe">選択したレシピを削除</button></section></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,addDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {getStorage,ref,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js';
const app=initializeApp({apiKey:'AIzaSyANJW9rxDj8DmPrvU9NMu2s1IuaTPekO5A',authDomain:'tacchan-family.firebaseapp.com',projectId:'tacchan-family',storageBucket:'tacchan-family.firebasestorage.app',messagingSenderId:'665510083723',appId:'1:665510083723:web:bc2ac6ff066270e79fa88e'});
const auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=id=>document.getElementById(id),names=['たっちゃん','みっちゃん','りく','もも','てん','あめ','ちょこ'],ids=['tacchan','micchan','riku','momo','ten','ame','choco'];
let recipes=new Map(),activeRecipe='';function status(s){$('status').textContent=s}function error(e){console.error(e);status('操作できませんでした：'+(e.code||e.message||e)+'\nFirebaseの権限設定を確認してな。')}function option(value,label){let o=document.createElement('option');o.value=value;o.textContent=label;return o}ids.forEach((id,i)=>$('person').append(option(id,names[i])));
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(e){error(e)}};$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){$('loginSection').classList.remove('hidden');$('editor').classList.add('hidden');status('ログインしてな。');return}try{const gate=await getDoc(doc(db,'admins',user.uid));if(!gate.exists()||gate.data().enabled!==true){await signOut(auth);status('このアカウントには管理権限がありません。');return}$('loginSection').classList.add('hidden');$('editor').classList.remove('hidden');status('管理者としてログイン中');await loadProfile();await loadRecipes()}catch(e){error(e)}});
async function upload(file,path){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('画像ファイルを選んでな');if(file.size>8*1024*1024)throw Error('写真は8MB以下にしてな');let ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';let r=ref(storage,path+'/'+crypto.randomUUID()+'.'+ext);await uploadBytes(r,file,{contentType:file.type});return getDownloadURL(r)}
function showPhotos(urls){let box=$('profilePhotos');box.replaceChildren();(urls||[]).slice(0,4).forEach((url,i)=>{if(!url)return;let img=document.createElement('img');img.className='preview';img.src=url;img.alt='写真'+(i+1);box.append(img)})}
async function loadProfile(){try{let d=await getDoc(doc(db,'profiles',$('person').value));let p=d.exists()?d.data():{};$('bio').value=p.bio||'';$('hobby').value=p.hobby||'';$('talent').value=p.talent||'';showPhotos(p.photos||[])}catch(e){error(e)}}$('person').onchange=loadProfile;
$('saveProfile').onclick=async()=>{let btn=$('saveProfile');btn.disabled=true;try{let id=$('person').value,existing=await getDoc(doc(db,'profiles',id)),photos=[...((existing.exists()?existing.data().photos:[])||[])];let file=$('profilePhoto').files[0];if(file)photos[Number($('slot').value)]=await upload(file,'profiles/'+id);await setDoc(doc(db,'profiles',id),{name:names[ids.indexOf(id)],bio:$('bio').value,hobby:$('hobby').value,talent:$('talent').value,photos,updatedAt:serverTimestamp()});$('profilePhoto').value='';showPhotos(photos);status('プロフィールを保存したで！')}catch(e){error(e)}finally{btn.disabled=false}};
async function loadRecipes(){try{recipes.clear();let snap=await getDocs(collection(db,'recipes'));snap.forEach(d=>recipes.set(d.id,d.data()));let sel=$('recipeSelect');sel.replaceChildren(option('','新しい料理を登録'));for(let [id,r] of recipes)sel.append(option(id,r.title||'名称なし'));activeRecipe='';fillRecipe()}catch(e){error(e)}}
function fillRecipe(){activeRecipe=$('recipeSelect').value;let r=recipes.get(activeRecipe)||{};$('recipeTitle').value=r.title||'';$('recipeDesc').value=r.description||'';$('ingredients').value=r.ingredients||'';$('steps').value=r.steps||'';let box=$('recipePreview');box.replaceChildren();if(r.image){let img=document.createElement('img');img.className='preview';img.src=r.image;img.alt='料理写真';box.append(img)}}$('recipeSelect').onchange=fillRecipe;
$('saveRecipe').onclick=async()=>{let btn=$('saveRecipe');btn.disabled=true;try{let title=$('recipeTitle').value.trim();if(!title)throw Error('料理名を入力してな');let r=recipes.get(activeRecipe)||{};let image=r.image||'';let file=$('recipePhoto').files[0];if(file)image=await upload(file,'recipes');let data={title,description:$('recipeDesc').value,ingredients:$('ingredients').value,steps:$('steps').value,image,updatedAt:serverTimestamp()};if(activeRecipe)await setDoc(doc(db,'recipes',activeRecipe),data);else await addDoc(collection(db,'recipes'),data);$('recipePhoto').value='';await loadRecipes();status('レシピを保存したで！')}catch(e){error(e)}finally{btn.disabled=false}};
$('deleteRecipe').onclick=async()=>{if(!activeRecipe)return status('削除する料理を選んでな');if(!confirm('このレシピを削除してもええ？'))return;try{await deleteDoc(doc(db,'recipes',activeRecipe));await loadRecipes();status('レシピを削除したで')}catch(e){error(e)}};
</script></body></html>
