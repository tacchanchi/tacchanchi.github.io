<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たっちゃん｜たっちゃん家</title><link rel="stylesheet" href="site.css"><style>.profile-lead{font-size:.85rem;color:#967760;text-align:center;letter-spacing:.08em}.profile-bio{max-width:490px;margin:12px auto 28px;text-align:left}.profile-bio p{margin:0 0 1.05em;line-height:1.95}.photos figure{margin:0;min-width:0}.photos .photo-tap{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-in}.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}.photos figcaption{font-size:clamp(10px,2.8vw,14px);margin-top:8px;color:#805d48}.profile-hero{max-width:420px;width:100%;max-height:440px;object-fit:contain}.photo-dialog::backdrop{background:#241b16b9}.photo-dialog img{display:block;max-width:min(85vw,850px);max-height:75vh;object-fit:contain}.photo-dialog p{text-align:center;margin:6px 0}@media(max-width:450px){.panel{padding:16px 12px}.photos{gap:7px}}</style></head><body><main class="wrap"><h1>🐾 たっちゃんの部屋 🐾</h1><p class="profile-lead">TACCHAN FAMILY</p><section class="panel"><img class="main-photo profile-hero" src="tatcchan.PNG" alt="たっちゃんのメイン写真"><h2>🐱 たっちゃん</h2><div class="profile-bio"><p>まいど〜！たっちゃんやで〜🐾</p><p>たっちゃん家のお父ちゃんやってます！</p><p>食べること、家族とお出かけすること、楽しいことが大好きやねん♪</p><p>ちょっとおちゃめで、たまに家族からツッコまれるけど、それも毎日のお楽しみ🤣</p><p>家族みんなで、笑ったり、のんびりしたり。</p><p>そんな何気ない日常をお届けしてるで〜！</p><p>これからも、たっちゃん家をよろしゅうな💕</p></div><h2>📸 たっちゃんの3つの顔</h2><div class="photos"><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'たっちゃん・😎 かっこいい')" aria-label="😎 かっこいいの写真を拡大"><img src="tacchan-cool.jpg" alt="たっちゃん・😎 かっこいい" loading="lazy"></button><figcaption>😎 かっこいい</figcaption></figure><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'たっちゃん・😜 おちゃめ')" aria-label="😜 おちゃめの写真を拡大"><img src="tacchan-playful.png" alt="たっちゃん・😜 おちゃめ" loading="lazy"></button><figcaption>😜 おちゃめ</figcaption></figure><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'たっちゃん・🍵 癒し')" aria-label="🍵 癒しの写真を拡大"><img src="tacchan-relax.png" alt="たっちゃん・🍵 癒し" loading="lazy"></button><figcaption>🍵 癒し</figcaption></figure></div><p style="font-size:.8rem;color:#967760">写真をタップすると大きく見られるで♡</p></section><dialog id="photoDialog" class="photo-dialog" onclick="if(event.target===this)this.close()"><button type="button" class="close" onclick="document.getElementById('photoDialog').close()">閉じる ×</button><img id="bigPhoto" alt="拡大写真"><p id="photoCaption"></p></dialog><script>function showPhoto(src,caption){document.getElementById('bigPhoto').src=src;document.getElementById('photoCaption').textContent=caption;document.getElementById('photoDialog').showModal()}</script><p style="text-align:center"><a class="button" href="index.html#family">🏠 家族紹介に戻る</a></p></main></body></html>
