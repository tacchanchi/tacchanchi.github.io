<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なおき｜たっちゃん家</title><link rel="stylesheet" href="site.css"><style>.profile-lead{font-size:.85rem;color:#967760;text-align:center;letter-spacing:.08em}.profile-bio{max-width:490px;margin:12px auto 28px;text-align:left}.profile-bio p{margin:0 0 1.05em;line-height:1.95}.photos figure{margin:0;min-width:0}.photos .photo-tap{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-in}.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}.photos figcaption{font-size:clamp(10px,2.8vw,14px);margin-top:8px;color:#805d48}.profile-hero{max-width:420px;width:100%;max-height:440px;object-fit:contain}.photo-dialog::backdrop{background:#241b16b9}.photo-dialog img{display:block;max-width:min(85vw,850px);max-height:75vh;object-fit:contain}.photo-dialog p{text-align:center;margin:6px 0}@media(max-width:450px){.panel{padding:16px 12px}.photos{gap:7px}}</style></head><body><main class="wrap"><h1>🐾 なおきの部屋 🐾</h1><p class="profile-lead">RIKU'S UNIVERSITY FRIENDS</p><section class="panel"><img class="main-photo profile-hero" src="naoki.jpg" alt="なおきのメイン写真"><h2>🎧 なおき</h2><div class="profile-bio"><p>なおきです。りくの大学の友達です。</p><p>グレーの毛と、首のヘッドホンとデニムジャケットが目印です。</p><p>明るくてノリがいいムードメーカー。いつもみんなを笑わせてくれます。</p><p>音楽とバスケとカフェ巡りが大好き。頼れる兄貴的存在です。</p><p>りく、たくみ、しょうと集まる時間が大好きです。</p></div><h2>📸 なおきの3つの顔</h2><div class="photos"><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'なおき・☕ カフェでノリノリ')" aria-label="☕ カフェでノリノリの写真を拡大"><img src="naoki-cafe.jpg" alt="なおき・☕ カフェでノリノリ" loading="lazy"></button><figcaption>☕ カフェでノリノリ</figcaption></figure><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'なおき・🏀 バスケ')" aria-label="🏀 バスケの写真を拡大"><img src="naoki-basket.jpg" alt="なおき・🏀 バスケ" loading="lazy"></button><figcaption>🏀 バスケ</figcaption></figure><figure><button type="button" class="photo-tap" onclick="showPhoto(this.querySelector('img').src, 'なおき・🌇 夕日の帰り道')" aria-label="🌇 夕日の帰り道の写真を拡大"><img src="naoki-evening.jpg" alt="なおき・🌇 夕日の帰り道" loading="lazy"></button><figcaption>🌇 夕日の帰り道</figcaption></figure></div><p style="font-size:.8rem;color:#967760">写真をタップすると大きく見られるよ♡</p></section><dialog id="photoDialog" class="photo-dialog" onclick="if(event.target===this)this.close()"><button type="button" class="close" onclick="document.getElementById('photoDialog').close()">閉じる ×</button><img id="bigPhoto" alt="拡大写真"><p id="photoCaption"></p></dialog><script>function showPhoto(src,caption){document.getElementById('bigPhoto').src=src;document.getElementById('photoCaption').textContent=caption;document.getElementById('photoDialog').showModal()}</script><p style="text-align:center"><a class="button" href="index.html">🐾 トップに戻る</a></p></main></body></html>
